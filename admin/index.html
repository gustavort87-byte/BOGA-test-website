<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOGA LAMPS · Administración</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --walnut-deep: #3A2318;   /* sidebar */
      --walnut: #5A3420;        /* primary actions */
      --parchment: #F4EEE7;     /* workspace base */
      --linen: #FFFDF9;         /* elevated panels */
      --amber: #C98A3E;         /* focus + active */
      --burgundy: #6B1E24;      /* destructive */
      --ink: #2B1A17;
      --ink-soft: #6E5A52;
      --line: rgba(90, 52, 32, .14);
      --line-strong: rgba(90, 52, 32, .28);

      --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem; --s7: 3rem;
      --radius: 6px;
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease-out: cubic-bezier(.22, 1, .36, 1);

      --shadow-rest: 0 1px 2px rgba(43, 26, 23, .05), 0 8px 20px -14px rgba(90, 52, 32, .28);
      --shadow-float: 0 2px 6px rgba(43, 26, 23, .08), 0 30px 60px -20px rgba(58, 35, 24, .45);

      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-body: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--parchment);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: .95rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* ---------- Shell ---------- */
    .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; gap: var(--s5);
      padding: var(--s5) var(--s4);
      background:
        radial-gradient(120% 40% at 0% 0%, rgba(201, 138, 62, .14), transparent 70%),
        var(--walnut-deep);
      color: #F1E6D8;
    }
    .brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); }
    .brand img { width: 52px; height: 52px; object-fit: contain; border-radius: 50%; background: #F8F3EE; padding: 2px; }
    .brand strong { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; display: block; }
    .brand span { font-size: .78rem; color: rgba(241, 230, 216, .62); }

    .nav { display: grid; gap: var(--s1); }
    .nav a, .sidebar-foot a {
      position: relative;
      display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
      padding: .6rem .8rem;
      border-radius: var(--radius);
      color: rgba(241, 230, 216, .78);
      text-decoration: none;
      transition: opacity .2s ease, transform .3s var(--ease-spring);
    }
    /* Lamp glow behind the active item: the one decorative moment */
    .nav a::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
      background: radial-gradient(90% 140% at 0% 50%, rgba(201, 138, 62, .38), rgba(201, 138, 62, .08) 60%, transparent);
      opacity: 0; transition: opacity .35s ease;
    }
    .nav a > * { position: relative; z-index: 1; }
    .nav a:hover::before { opacity: .45; }
    .nav a[aria-current="page"] { color: #FFF8EE; }
    .nav a[aria-current="page"]::before { opacity: 1; }
    .nav a:active, .sidebar-foot a:active { transform: scale(.98); }
    .nav a:focus-visible, .sidebar-foot a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .nav .count { font-size: .75rem; padding: 0 .5rem; border-radius: 999px; background: rgba(241, 230, 216, .12); }
    .sidebar-foot { margin-top: auto; display: grid; gap: var(--s1); font-size: .85rem; }
    .sidebar-foot a:hover { color: #FFF8EE; }

    .main { padding: var(--s6) clamp(var(--s4), 4vw, var(--s7)); min-width: 0; }
    .view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); }
    .view-head h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 3.4vw, 2.6rem); letter-spacing: -.03em; line-height: 1; margin: 0 0 var(--s2); }
    .view-head p { margin: 0; color: var(--ink-soft); }

    /* ---------- Controls ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      padding: .62rem 1.1rem;
      border: 0; border-radius: 999px;
      background: var(--walnut); color: #FFF8EE;
      font-weight: 500; font-size: .9rem; text-decoration: none; cursor: pointer;
      box-shadow: 0 1px 2px rgba(43, 26, 23, .12), 0 10px 20px -12px rgba(90, 52, 32, .6);
      transition: transform .35s var(--ease-spring), opacity .2s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: .92; }
    .btn:active { transform: translateY(0) scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    .btn:disabled { opacity: .5; cursor: progress; transform: none; }
    .btn-quiet { background: transparent; color: var(--walnut); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .btn-danger { background: transparent; color: var(--burgundy); box-shadow: inset 0 0 0 1px rgba(107, 30, 36, .35); }
    .btn-small { padding: .38rem .8rem; font-size: .82rem; }

    .icon-btn {
      display: inline-grid; place-items: center; width: 2rem; height: 2rem;
      border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); cursor: pointer;
      transition: transform .3s var(--ease-spring), opacity .2s ease;
    }
    .icon-btn:hover { background: var(--parchment); color: var(--ink); }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-bottom: var(--s4); }
    .search {
      flex: 1 1 240px; max-width: 360px;
      padding: .6rem .9rem; border: 0; border-radius: 999px;
      background: var(--linen); box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .search:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--amber); }

    .filters { display: flex; flex-wrap: wrap; gap: var(--s2); }
    .filter {
      padding: .4rem .85rem; border: 0; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--ink-soft); font-size: .86rem;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: transform .3s var(--ease-spring), opacity .2s ease;
    }
    .filter:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .filter:active { transform: scale(.96); }
    .filter:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .filter[aria-pressed="true"] { background: var(--walnut); color: #FFF8EE; box-shadow: none; }
    .filter .n { opacity: .7; margin-left: .25rem; }

    /* ---------- Tables ---------- */
    .panel { background: var(--linen); border-radius: var(--radius); box-shadow: var(--shadow-rest); overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { text-align: left; padding: .7rem var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-weight: 500; font-size: .8rem; color: var(--ink-soft); background: #FBF7F2; position: sticky; top: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #FBF6F0; }
    tbody tr:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
    tbody tr:active { background: #F6EEE4; }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .thumb { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: var(--parchment); }
    .thumb-empty { display: grid; place-items: center; color: var(--ink-soft); font-size: .7rem; }
    .cell-title { font-weight: 500; }
    .cell-sub { color: var(--ink-soft); font-size: .84rem; }
    .muted { color: var(--ink-soft); }

    .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .6rem; border-radius: 999px; font-size: .8rem; white-space: nowrap; }
    .pill::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
    .pill-amber { background: rgba(201, 138, 62, .16); color: #8A5A1E; }
    .pill-olive { background: rgba(95, 107, 58, .15); color: #4B5530; }
    .pill-slate { background: rgba(63, 90, 107, .14); color: #34505F; }
    .pill-walnut { background: rgba(90, 52, 32, .12); color: var(--walnut); }
    .pill-wine { background: rgba(107, 30, 36, .12); color: var(--burgundy); }
    .pill-plain { background: rgba(110, 90, 82, .12); color: var(--ink-soft); }

    .empty { padding: var(--s7) var(--s5); text-align: center; color: var(--ink-soft); }
    .empty strong { display: block; font-family: var(--font-display); font-size: 1.6rem; font-weight: 500; color: var(--ink); margin-bottom: var(--s2); }
    .empty .btn { margin-top: var(--s4); }

    /* ---------- Drawer ---------- */
    .scrim {
      position: fixed; inset: 0; z-index: 40; background: rgba(43, 26, 23, .38);
      opacity: 0; pointer-events: none; transition: opacity .3s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
      width: min(600px, 100vw);
      display: flex; flex-direction: column;
      background: var(--linen); box-shadow: var(--shadow-float);
      transform: translateX(104%); transition: transform .5s var(--ease-out);
    }
    .drawer.open { transform: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
    .drawer-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.7rem; letter-spacing: -.02em; margin: 0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: var(--s5); display: grid; gap: var(--s5); align-content: start; }
    .drawer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-top: 1px solid var(--line); background: #FBF7F2; }
    .drawer-foot .spacer { flex: 1; }

    fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--s4); }
    legend { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; padding: 0; margin-bottom: var(--s3); }
    .grid-2 { display: grid; gap: var(--s4); grid-template-columns: 1fr 1fr; }
    .grid-3 { display: grid; gap: var(--s4); grid-template-columns: 2fr 1fr 1fr; }
    label.field { display: grid; gap: var(--s1); font-size: .86rem; font-weight: 500; }
    label.field .hint { font-weight: 400; color: var(--ink-soft); font-size: .8rem; }
    .input {
      width: 100%; padding: .6rem .75rem; border: 0; border-radius: var(--radius);
      background: #FFF; box-shadow: inset 0 0 0 1px var(--line-strong); font-weight: 400;
    }
    .input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--amber); }
    textarea.input { min-height: 6rem; resize: vertical; }
    .check { display: flex; align-items: flex-start; gap: var(--s3); font-size: .9rem; cursor: pointer; }
    .check input { width: 1.1rem; height: 1.1rem; margin-top: .2rem; accent-color: var(--walnut); }
    .check input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .check small { display: block; color: var(--ink-soft); }

    /* Photo manager */
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: var(--s3); }
    .photo { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--parchment); box-shadow: inset 0 0 0 1px var(--line); }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo .tag { position: absolute; left: 6px; top: 6px; padding: .05rem .45rem; border-radius: 999px; background: var(--walnut); color: #FFF8EE; font-size: .7rem; }
    .photo .actions { position: absolute; inset: auto 0 0 0; display: flex; justify-content: flex-end; gap: 2px; padding: 4px; background: linear-gradient(to top, rgba(43, 26, 23, .7), transparent); }
    .photo .actions button { width: 1.8rem; height: 1.8rem; border: 0; border-radius: 50%; background: rgba(255, 253, 249, .92); color: var(--ink); cursor: pointer; font-size: .85rem; transition: transform .3s var(--ease-spring); }
    .photo .actions button:hover { transform: scale(1.08); }
    .photo .actions button:active { transform: scale(.92); }
    .photo .actions button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
    .dropzone {
      display: grid; place-items: center; gap: var(--s1); aspect-ratio: 1; padding: var(--s2);
      border-radius: var(--radius); border: 1.5px dashed var(--line-strong);
      color: var(--ink-soft); text-align: center; font-size: .82rem; cursor: pointer;
      transition: transform .3s var(--ease-spring), opacity .2s ease;
    }
    .dropzone:hover, .dropzone.over { border-color: var(--amber); color: var(--walnut); }
    .dropzone:active { transform: scale(.97); }
    .dropzone:focus-within { outline: 2px solid var(--amber); outline-offset: 2px; }
    .dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    /* Order items */
    .items { display: grid; gap: var(--s2); }
    .item-row { display: grid; grid-template-columns: 1fr 70px 110px 2rem; gap: var(--s2); align-items: center; }
    .totals { display: grid; gap: var(--s1); justify-items: end; font-variant-numeric: tabular-nums; }
    .totals strong { font-size: 1.15rem; }

    .settings { max-width: 640px; padding: var(--s5); display: grid; gap: var(--s5); }
    .note { padding: var(--s4); border-radius: var(--radius); background: #FBF4EA; box-shadow: inset 3px 0 0 var(--amber); color: var(--ink-soft); font-size: .9rem; }
    .note strong { color: var(--ink); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: var(--s5); z-index: 60;
      padding: .7rem 1.1rem; border-radius: 999px;
      background: var(--walnut-deep); color: #FFF8EE; box-shadow: var(--shadow-float);
      transform: translate(-50%, 140%); opacity: 0;
      transition: transform .5s var(--ease-spring), opacity .3s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: var(--burgundy); }

    /* ---------- Small screens ---------- */
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { position: sticky; z-index: 30; height: auto; flex-direction: row; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); overflow-x: auto; }
      .brand { padding: 0; }
      .brand span, .brand strong, .sidebar-foot { display: none; }
      .brand img { width: 40px; height: 40px; flex-shrink: 0; }
      .nav { display: flex; }
      .nav a { white-space: nowrap; }
      .main { padding: var(--s5) var(--s4); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .item-row { grid-template-columns: 1fr 56px 90px 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/brand_assets/BOGA%20LAMPS%20LOGO%20PNG%20(1).png" alt="" />
        <div><strong>BOGA LAMPS</strong><span>Administración</span></div>
      </div>
      <nav class="nav" aria-label="Secciones">
        <a href="#productos" data-view="productos"><span>Productos</span><span class="count" id="count-productos"></span></a>
        <a href="#pedidos" data-view="pedidos"><span>Pedidos</span><span class="count" id="count-pedidos"></span></a>
        <a href="#clientes" data-view="clientes"><span>Clientes</span><span class="count" id="count-clientes"></span></a>
        <a href="#ajustes" data-view="ajustes"><span>Ajustes</span></a>
      </nav>
      <div class="sidebar-foot">
        <a href="http://localhost:3000" target="_blank" rel="noopener">Ver sitio en localhost:3000</a>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <form id="drawer-form" novalidate style="display:contents">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-foot" id="drawer-foot"></div>
    </form>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
